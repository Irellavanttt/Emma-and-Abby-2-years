<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Emma and Abby 2 year</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>To the love of my life</h1>
    <p>Happy anniversary, love! I cannot believe that it has been 2 years with you. It feels like that time has genuinely flown by and I am so happy to have you in my life. I hope these letters will make you feel as loved as you make me feel.</p>
  </header>
  <main class="grid" id="grid"></main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Letter">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <div class="stage" id="stage">
      <div class="envelope" id="envelope" tabindex="0" role="button" aria-label="Open envelope">
        <div class="back"></div>
       <div class="letter" id="letter"></div>
        <div class="front"></div>
        <div class="flap"></div>
        <div class="seal">&hearts;</div>
      </div>
      <div class="hint" id="hint">Click the envelope to open it</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
